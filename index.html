<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305060a'/%3E%3Crect x='2' y='2' width='12' height='12' fill='%23ffcc44'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23ff5522'/%3E%3C/svg%3E" />
    <meta name="description" content="IRON STORM - original 8-bit style run & gun action game (HTML5 Canvas 2D)" />
    <title>IRON STORM</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #05060a;
        overflow: hidden;
        font-family: "Consolas", "Courier New", monospace;
        color: #cfd6e4;
        -webkit-font-smoothing: none;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 40%, #10131d 0%, #05060a 70%);
      }
      #game {
        display: block;
        background: #000;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        -ms-interpolation-mode: nearest-neighbor;
        box-shadow: 0 0 0 2px #1d2433, 0 12px 60px rgba(0, 0, 0, 0.9);
        touch-action: none;
        outline: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        justify-content: center;
        background: #05060a;
        z-index: 10;
        font-size: 14px;
        letter-spacing: 1px;
      }
      #boot.hide { display: none; }
      #boot b { color: #ffcc44; font-size: 20px; letter-spacing: 4px; }
      .hint { color: #6d7891; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="640" height="360" tabindex="0"></canvas>
    </div>
    <div id="boot">
      <b>IRON STORM</b>
      <div class="hint">Loading original pixel arsenal...</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
